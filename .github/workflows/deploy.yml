name: Deploy to GitHub Pages

on:
  # Deploy whenever something lands on main.
  push:
    branches: [main]
  # ...and allow a manual run from the Actions tab.
  workflow_dispatch:

# Permissions the deploy needs. These are the values GitHub Pages expects.
permissions:
  contents: read
  pages: write
  id-token: write

# If two deploys overlap, let the running one finish rather than cancelling it.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs dependencies, runs `astro build`, and uploads dist/ as the
      # Pages artifact — all in one step.
      - name: Install, build and upload the site
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
